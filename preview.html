<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 酒馆 - 页面预览</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #e8e8e8;
  display: flex;
  justify-content: center;
  padding: 20px;
  gap: 16px;
  flex-wrap: wrap;
}
.phone {
  width: 375px;
  height: 700px;
  background: #f5f5f5;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(0,0,0,0.15);
  display: flex;
  flex-direction: column;
  position: relative;
}
.phone-label {
  text-align: center;
  font-size: 13px;
  color: #666;
  margin-bottom: 8px;
  font-weight: 600;
}
.phone-wrap { display: flex; flex-direction: column; align-items: center; }

/* TabBar */
.tabbar {
  display: flex;
  background: #fff;
  border-top: 1px solid #e5e5e5;
  padding: 4px 0 env(safe-area-inset-bottom);
  flex-shrink: 0;
}
.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 4px 0;
  font-size: 11px;
  color: #999;
}
.tab-item.active { color: #7B68EE; }
.tab-icon { width: 24px; height: 24px; border-radius: 4px; margin-bottom: 2px; background: #ccc; }
.tab-item.active .tab-icon { background: #7B68EE; }

/* Characters Page */
.char-header, .model-header, .chat-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  flex-shrink: 0;
}
.char-header { background: #fff; border-bottom: 1px solid #eee; }
.char-title, .model-title, .chat-title { font-size: 20px; font-weight: bold; }
.add-btn {
  background: #7B68EE;
  color: #fff;
  border: none;
  padding: 6px 14px;
  border-radius: 16px;
  font-size: 13px;
  cursor: pointer;
}
.char-list, .model-list {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
}
.char-card, .model-card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  display: flex;
  align-items: center;
}
.char-avatar {
  width: 56px; height: 56px; border-radius: 50%; margin-right: 14px;
  background: linear-gradient(135deg, #7B68EE, #a78bfa);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 22px; font-weight: bold; flex-shrink: 0;
}
.char-avatar.img { background: #e0e0e0; }
.char-info { flex: 1; }
.char-name, .model-name { font-size: 16px; font-weight: 600; }
.char-desc { font-size: 12px; color: #999; margin-top: 2px; }
.model-info { font-size: 13px; color: #666; margin-bottom: 2px; }
.model-url { font-size: 12px; color: #999; }
.card-actions { display: flex; gap: 6px; margin-top: 8px; }
.card-actions button {
  padding: 4px 12px; border-radius: 12px; font-size: 12px;
  border: 1px solid #7B68EE; background: #fff; color: #7B68EE; cursor: pointer;
}
.card-actions button.warn { border-color: #e74c3c; color: #e74c3c; }

/* Model Form */
.form-group { margin-bottom: 14px; }
.form-label { display: block; font-size: 14px; color: #333; margin-bottom: 4px; }
.form-input {
  width: 100%; border: 1px solid #ddd; border-radius: 8px;
  padding: 10px 12px; font-size: 15px; background: #fff; outline: none;
}
.form-input:focus { border-color: #7B68EE; }
.form-row { display: flex; gap: 10px; }
.form-half { flex: 1; }
.submit-btn {
  background: #7B68EE; color: #fff; border: none; border-radius: 8px;
  padding: 12px; width: 100%; font-size: 16px; margin-top: 8px; cursor: pointer;
}
.delete-btn {
  background: #e74c3c; color: #fff; border: none; border-radius: 8px;
  padding: 12px; width: 100%; font-size: 16px; margin-top: 8px; cursor: pointer;
}

/* Chat Page */
.chat-top {
  padding: 12px 16px; background: #fff; border-bottom: 1px solid #eee;
}
.chat-title { font-size: 17px; font-weight: 600; }
.chat-body {
  flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column;
}
.bubble { display: flex; margin-bottom: 14px; }
.bubble.user { justify-content: flex-end; }
.bubble.assistant { justify-content: flex-start; }
.bubble-content {
  max-width: 75%; padding: 10px 14px; border-radius: 16px;
  font-size: 14px; line-height: 1.5;
}
.bubble.user .bubble-content {
  background: #7B68EE; color: #fff; border-bottom-right-radius: 4px;
}
.bubble.assistant .bubble-content {
  background: #fff; color: #333; border-bottom-left-radius: 4px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
.chat-input-bar {
  display: flex; padding: 10px 12px; background: #fff;
  border-top: 1px solid #eee; align-items: center; gap: 8px; flex-shrink: 0;
}
.chat-input {
  flex: 1; border: 1px solid #ddd; border-radius: 20px;
  padding: 8px 16px; font-size: 15px; background: #f5f5f5; outline: none;
}
.send-btn {
  background: #7B68EE; color: #fff; border: none;
  border-radius: 20px; padding: 8px 18px; font-size: 14px; cursor: pointer;
}
.empty-state { text-align: center; padding: 60px 0; color: #999; }
.empty-state .icon { font-size: 48px; display: block; margin-bottom: 10px; }
</style>
</head>
<body>

<!-- Page 1: 角色列表 -->
<div class="phone-wrap">
  <div class="phone-label">📋 角色列表页</div>
  <div class="phone">
    <div class="char-header">
      <div class="char-title">我的角色</div>
      <button class="add-btn">+ 导入</button>
    </div>
    <div class="char-list">
      <div class="char-card">
        <div class="char-avatar">A</div>
        <div class="char-info">
          <div class="char-name">爱丽丝</div>
          <div class="char-desc">温柔的邻家少女 (头像由MongoDB提供)</div>
        </div>
      </div>
      <div class="char-card">
        <div class="char-avatar">龙</div>
        <div class="char-info">
          <div class="char-name">龙王敖渊</div>
          <div class="char-desc">威严的东海龙王</div>
        </div>
      </div>
      <div class="char-card">
        <div class="char-avatar">猫</div>
        <div class="char-info">
          <div class="char-name">小咪</div>
          <div class="char-desc">傲娇的猫娘助手</div>
        </div>
      </div>
    </div>
    <div class="tabbar">
      <div class="tab-item active"><div class="tab-icon" style="background:#7B68EE"></div>角色</div>
      <div class="tab-item"><div class="tab-icon"></div>对话</div>
      <div class="tab-item"><div class="tab-icon"></div>模型</div>
    </div>
  </div>
</div>

<!-- Page 2: 对话页 -->
<div class="phone-wrap">
  <div class="phone-label">💬 对话页（流式输出）</div>
  <div class="phone">
    <div class="chat-top">
      <div class="chat-title">与 爱丽丝 对话</div>
    </div>
    <div class="chat-body">
      <div class="bubble assistant">
        <div class="bubble-content">你好呀，今天想聊些什么呢？</div>
      </div>
      <div class="bubble user">
        <div class="bubble-content">给我讲个故事吧</div>
      </div>
      <div class="bubble assistant">
        <div class="bubble-content">从前有一座小镇，镇上的图书馆藏着一本会说话的书。每当有读者翻开它，书就会低声讲述一个只属于那个读者的故事...</div>
      </div>
    </div>
    <div class="chat-input-bar">
      <input class="chat-input" placeholder="输入消息...">
      <button class="send-btn">发送</button>
    </div>
    <div class="tabbar">
      <div class="tab-item"><div class="tab-icon"></div>角色</div>
      <div class="tab-item active"><div class="tab-icon" style="background:#7B68EE"></div>对话</div>
      <div class="tab-item"><div class="tab-icon"></div>模型</div>
    </div>
  </div>
</div>

<!-- Page 3: 模型管理 -->
<div class="phone-wrap">
  <div class="phone-label">⚙️ 模型管理页</div>
  <div class="phone">
    <div class="model-header">
      <div class="model-title">模型配置</div>
      <button class="add-btn">+ 添加</button>
    </div>
    <div class="model-list">
      <div class="model-card" style="flex-direction:column;align-items:stretch">
        <div class="model-name">DeepSeek</div>
        <div class="model-info">模型: deepseek-chat</div>
        <div class="model-url">api.deepseek.com</div>
        <div class="card-actions">
          <button>编辑</button>
          <button class="warn">删除</button>
        </div>
      </div>
      <div class="model-card" style="flex-direction:column;align-items:stretch">
        <div class="model-name">通义千问</div>
        <div class="model-info">模型: qwen-plus</div>
        <div class="model-url">dashscope.aliyuncs.com</div>
        <div class="card-actions">
          <button>编辑</button>
          <button class="warn">删除</button>
        </div>
      </div>
    </div>
    <div class="tabbar">
      <div class="tab-item"><div class="tab-icon"></div>角色</div>
      <div class="tab-item"><div class="tab-icon"></div>对话</div>
      <div class="tab-item active"><div class="tab-icon" style="background:#7B68EE"></div>模型</div>
    </div>
  </div>
</div>

</body>
</html>
